<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast Ultimate</title>
    <style>
        :root { --bg-color: #0f172a; --grid-bg: #1e293b; --cell-bg: #334155; --cell-filled: #38bdf8; --accent-color: #f43f5e; }
        body { margin: 0; background: var(--bg-color); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; touch-action: none; }
        #version-tag { position: absolute; top: 10px; right: 10px; font-size: 10px; color: rgba(255,255,255,0.3); }
        
        /* Layout */
        .container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 360px; padding-top: 10px; }
        
        /* Audio Section */
        #audio-panel { background: #1e293b; padding: 10px; border-radius: 12px; margin-bottom: 10px; text-align: center; border: 1px solid #475569; width: 90%; }
        
        /* Game Board */
        #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: #1e293b; padding: 12px; border-radius: 16px; width: 320px; aspect-ratio: 1/1; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .cell { background: #334155; border-radius: 4px; }
        .cell.filled { background: var(--cell-filled); box-shadow: inset 0 0 10px rgba(255,255,255,0.2); }
        
        /* Pieces UI */
        #pieces { display: flex; gap: 10px; margin-top: 20px; height: 100px; }
        .piece { background: #1e293b; padding: 10px; border-radius: 8px; cursor: grab; }
        
        /* Game Over */
        #game-over { display: none; position: fixed; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="version-tag">v4.0-MASTER</div>
    <div class="container">
        <h1>Block Blast</h1>

        <div id="audio-panel">
            <input type="file" id="music-upload" accept="audio/*">
            <button onclick="audio.play()" style="padding: 5px 15px; border-radius: 10px; cursor: pointer;">Play 🎵</button>
            <p id="status" style="font-size: 10px; margin-top: 5px; color: #94a3b8;">Pilih lagu & Play</p>
        </div>

        <div id="grid"></div>
        <div id="pieces">
            <div class="piece" draggable="true" ondragstart="drag(event)">Balok A</div>
            <div class="piece" draggable="true" ondragstart="drag(event)">Balok B</div>
        </div>
    </div>

    <div id="game-over">
        <h2>GAME OVER</h2>
        <button onclick="location.reload()">Main Lagi</button>
    </div>

    <script>
        // 1. Audio Logic
        const audio = new Audio();
        document.getElementById('music-upload').onchange = (e) => {
            audio.src = URL.createObjectURL(e.target.files[0]);
            document.getElementById('status').innerText = "Loaded: " + e.target.files[0].name;
        };

        // 2. Grid & Gameplay Logic
        const grid = document.getElementById('grid');
        for(let i=0; i<100; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.ondragover = (e) => e.preventDefault();
            cell.ondrop = (e) => {
                cell.classList.add('filled');
                checkCombo();
            };
            grid.appendChild(cell);
        }

        function checkCombo() {
            // Logika Mega Combo & Skor kamu kembali ke sini
            console.log("Combo detected!");
        }

        function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    </script>
</body>
</html>
