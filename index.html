<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast Modern Edition</title>
    <style>
        :root { --bg-color: #0f172a; --grid-bg: #1e293b; --cell-bg: #334155; --cell-filled: #38bdf8; --accent-color: #f43f5e; }
        body { margin: 0; background: var(--bg-color); font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; touch-action: none; }
        
        #version-tag { position: absolute; top: 10px; right: 10px; font-size: 10px; color: rgba(255, 255, 255, 0.3); }
        h1 { margin: 20px 0 10px; font-size: 26px; background: linear-gradient(to right, #38bdf8, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Audio Control Panel */
        .audio-panel { background: #1e293b; padding: 15px; border-radius: 20px; width: 85vw; max-width: 320px; text-align: center; margin-bottom: 20px; border: 1px solid #475569; }
        .btn-play { background: #22c55e; color: white; border: none; padding: 8px 16px; border-radius: 99px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        /* Game Grid */
        #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; background: var(--grid-bg); padding: 12px; border-radius: 16px; width: 85vw; max-width: 360px; aspect-ratio: 1 / 1; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .cell { background: var(--cell-bg); border-radius: 4px; aspect-ratio: 1 / 1; }
        .cell.filled { background: var(--cell-filled); box-shadow: inset 0 0 10px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="version-tag">v3.6</div>
    <h1>Block Blast: Modern</h1>

    <div class="audio-panel">
        <input type="file" id="music-upload" accept="audio/*">
        <button class="btn-play" onclick="playAudio()">Play Musik 🎵</button>
        <p id="status" style="font-size: 11px; margin-top: 8px; color: #94a3b8;">Pilih file & klik Play</p>
    </div>

    <div id="grid"></div>

    <script>
        const audio = new Audio();
        document.getElementById('music-upload').onchange = (e) => {
            audio.src = URL.createObjectURL(e.target.files[0]);
            document.getElementById('status').innerText = "File: " + e.target.files[0].name;
        };

        function playAudio() {
            if(!audio.src) { alert("Pilih file dulu!"); return; }
            audio.play().catch(() => alert("Klik di area grid untuk mulai audio!"));
        }

        // Generate Grid Cantik
        const grid = document.getElementById('grid');
        for(let i=0; i<100; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onclick = () => cell.classList.toggle('filled');
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
